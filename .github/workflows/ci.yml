name: CI
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", "22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run duplication
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: npm ci
      - run: bun test tests/storage tests/adapters tests/checks
