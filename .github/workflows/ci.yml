name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", "22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run duplication
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: npm ci
      - run: bun test tests/storage tests/adapters tests/checks

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, bun]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
